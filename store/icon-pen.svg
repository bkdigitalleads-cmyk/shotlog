<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC2A8"/><stop offset=".5" stop-color="#FFC2A8"/><stop offset="1" stop-color="#F39A7A"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2F97"/><stop offset="1" stop-color="#27409F"/></linearGradient>
