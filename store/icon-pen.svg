<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Shot Log's icon: an injector pen (no needle) on a blue tile. The pen's shapes and every colour,
     gradient and shadow value are Brian's (Nov 15, 2026). store/icon.js draws all icon files from
     this one file: `node store/icon.js options && node store/icon.js`. -->
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4263EE"/><stop offset="1" stop-color="#1C34A6"/></linearGradient>
<radialGradient id="glow" cx=".22" cy=".16" r=".75"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
