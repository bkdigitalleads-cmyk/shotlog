<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Shot Log's icon: an injector pen (no needle) on a solid blue tile. The pen's shapes are Brian's
     artwork as sent on Nov 15, 2026. The defs (gradients, shadow) and the tile colour were rebuilt
     here because the start of the SVG was cut off in transit; paste the original over this file and
     run `node store/icon.js options && node store/icon.js` to redraw everything from it. -->
<defs>
<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9B7D"/><stop offset=".55" stop-color="#F2714F"/><stop offset="1" stop-color="#DA5838"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F2F4F9"/><stop offset="1" stop-color="#D9DFEC"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E3A57"/><stop offset="1" stop-color="#1A2135"/></linearGradient>
<filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1440" flood-opacity=".38"/></filter>
</defs>
<rect width="1024" height="1024" fill="#2747C9"/>
